# Open the built site in Chromium, Firefox and WebKit (Safari) at desktop and phone width, in
# light and dark mode and with an English and a Japanese browser, on every pull request.
# The shared workflow in nguekwang/research-aide does the work (rule: research-aide
# .claude/rules/web-browsers.md). List one page of every kind below.
name: browsers
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browsers-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browsers:
    uses: nguekwang/research-aide/.github/workflows/browser-check.yml@main
    with:
      build: bash tools/build_site.sh
      site-dir: dist
      locales: en-US ja-JP
      pages: |
        /
        /?q=bunun
        /signs-and-scripts.html
        /afro-asiatic/berber/
        /wals/
        /stats/
        /sources/
        /updates/
        /feature-map.html
        /feature-map.html?c=81A:1&c=6A:2,3,4&c=|7A:2&k=6A
        /404.html
